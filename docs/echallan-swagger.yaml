openapi: 3.0.3
info:
  title: DIGIT eChallan API (Go Implementation)
  description: 'API documentation for the Go implementation of the DIGIT eChallan
    project.

    Includes echallan-services and echallan-calculator microservices.

    '
  version: 2.0.0
servers:
- url: http://localhost:8082
  description: eChallan Services (Local)
- url: http://localhost:8078
  description: eChallan Calculator (Local)
security:
- bearerAuth: []
paths:
  /eChallan/v1/_create:
    post:
      summary: Create a new Challan
      description: Creates a new challan in the system. Triggers ID generation, calculation
        (billing), and persistence.
      operationId: createChallan
      servers:
      - url: http://localhost:8082
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallanRequest'
            example:
              RequestInfo:
                apiId: echallan
                ver: '1.0'
                ts: 1672531200000
                action: _create
                msgId: msg-123
              challan:
                tenantId: pb.amritsar
                businessService: echallan
                applicationStatus: ACTIVE
                citizen:
                  name: John Doe
                  mobileNumber: '9999999999'
                  tenantId: pb
                amount:
                - taxHeadCode: CHALLAN_FEE
                  amount: 100.0
                taxPeriodFrom: 1672531200000
                taxPeriodTo: 1704067200000
      responses:
        '200':
          description: Challan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallanResponse'
        '400':
          description: Bad Request (Validation or Creation Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /eChallan/v1/_search:
    post:
      summary: Search Challans
      description: Searches for existing challans based on query parameters.
      operationId: searchChallans
      servers:
      - url: http://localhost:8082
      parameters:
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
      - name: ids
        in: query
        required: false
        schema:
          type: string
      - name: challanNo
        in: query
        required: false
        schema:
          type: string
      - name: accountId
        in: query
        required: false
        schema:
          type: string
      - name: mobileNumber
        in: query
        required: false
        schema:
          type: string
      - name: businessService
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: receiptNumber
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInfoWrapper'
            example:
              RequestInfo:
                apiId: echallan
                ver: '1.0'
                ts: 1672531200000
                action: _search
                msgId: msg-123
      responses:
        '200':
          description: Successful search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallanResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /eChallan/v1/_update:
    post:
      summary: Update a Challan
      description: Updates an existing challan.
      operationId: updateChallan
      servers:
      - url: http://localhost:8082
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallanRequest'
            example:
              RequestInfo:
                apiId: echallan
                ver: '1.0'
                ts: 1672531200000
                action: _update
                msgId: msg-123
              challan:
                tenantId: pb.amritsar
                businessService: echallan
                challanNo: CH-2023-10-10-0001
                applicationStatus: CANCELLED
                amount:
                - taxHeadCode: CHALLAN_FEE
                  amount: 100.0
                taxPeriodFrom: 1672531200000
                taxPeriodTo: 1704067200000
      responses:
        '200':
          description: Challan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallanResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /eChallan/v1/_count:
    post:
      summary: Count Challans
      description: Returns the total count and total amount collected for a tenant.
      operationId: countChallans
      servers:
      - url: http://localhost:8082
      parameters:
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInfoWrapper'
            example:
              RequestInfo:
                apiId: echallan
                ver: '1.0'
                ts: 1672531200000
                action: _count
                msgId: msg-123
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalChallans:
                    type: integer
                  totalAmount:
                    type: integer
                  totalServices:
                    type: integer
                  totalCollection:
                    type: integer
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /echallan-calculator/v1/_calculate:
    post:
      summary: Calculate Challan Demands
      description: Calculates tax heads and generates demands in billing-service based
        on challan details.
      operationId: calculateDemands
      servers:
      - url: http://localhost:8078
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
            example:
              RequestInfo:
                apiId: echallan
                ver: '1.0'
                ts: 1672531200000
                action: _calculate
                msgId: msg-123
              CalulationCriteria:
              - tenantId: pb.amritsar
                challan:
                  tenantId: pb.amritsar
                  businessService: echallan
                  challanNo: CH-2023-10-10-0001
                  amount:
                  - taxHeadCode: CHALLAN_FEE
                    amount: 100.0
                  taxPeriodFrom: 1672531200000
                  taxPeriodTo: 1704067200000
      responses:
        '200':
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RequestInfo:
      type: object
      properties:
        apiId:
          type: string
        ver:
          type: string
        ts:
          type: integer
          format: int64
        action:
          type: string
        did:
          type: string
        key:
          type: string
        msgId:
          type: string
        authToken:
          type: string
          deprecated: true
        userInfo:
          $ref: '#/components/schemas/UserInfo'
    UserInfo:
      type: object
      properties:
        tenantId:
          type: string
        uuid:
          type: string
        userName:
          type: string
        mobileNumber:
          type: string
        type:
          type: string
        active:
          type: boolean
    RequestInfoWrapper:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
    ResponseInfo:
      type: object
      properties:
        apiId:
          type: string
        ver:
          type: string
        ts:
          type: integer
          format: int64
        resMsgId:
          type: string
        msgId:
          type: string
        status:
          type: string
    ChallanRequest:
      type: object
      required:
      - RequestInfo
      - challan
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        challan:
          $ref: '#/components/schemas/Challan'
    ChallanResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        challans:
          type: array
          items:
            $ref: '#/components/schemas/Challan'
        countOfServices:
          type: integer
        totalAmountCollected:
          type: integer
    Challan:
      type: object
      properties:
        tenantId:
          type: string
        businessService:
          type: string
        challanNo:
          type: string
        applicationStatus:
          type: string
        description:
          type: string
        accountId:
          type: string
        citizen:
          $ref: '#/components/schemas/Citizen'
        amount:
          type: array
          items:
            $ref: '#/components/schemas/Amount'
        taxPeriodFrom:
          type: integer
          format: int64
        taxPeriodTo:
          type: integer
          format: int64
    Citizen:
      type: object
      properties:
        name:
          type: string
        mobileNumber:
          type: string
        tenantId:
          type: string
        type:
          type: string
    Amount:
      type: object
      properties:
        taxHeadCode:
          type: string
        amount:
          type: number
          format: double
    CalculationRequest:
      type: object
      required:
      - RequestInfo
      - CalulationCriteria
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        CalulationCriteria:
          type: array
          description: Intentional typo in property name (CalulationCriteria) to match
            legacy Java API
          items:
            $ref: '#/components/schemas/CalulationCriterion'
    CalulationCriterion:
      type: object
      properties:
        tenantId:
          type: string
        challan:
          $ref: '#/components/schemas/Challan'
    CalculationResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        Calculations:
          type: array
          items:
            $ref: '#/components/schemas/Calculation'
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Calculation:
      type: object
      properties:
        tenantId:
          type: string
        challanNo:
          type: string
        taxHeadEstimate:
          type: array
          items:
            $ref: '#/components/schemas/TaxEstimate'
    TaxEstimate:
      type: object
      properties:
        taxHeadCode:
          type: string
        estimateAmount:
          type: number
          format: double
    ErrorResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
        params:
          type: string
